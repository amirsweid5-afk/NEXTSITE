<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="utf-8" />
	<title>NEXTSITE UI film</title>
	<style>
		html, body {
			margin: 0;
			width: 1920px;
			height: 1080px;
			overflow: hidden;
			background: #090a0d;
			font-family: "Segoe UI", sans-serif;
		}

		#stage {
			position: relative;
			width: 1920px;
			height: 1080px;
			overflow: hidden;
			background: #090a0d;
		}

		#world {
			position: absolute;
			left: 0;
			top: 0;
			width: 3600px;
			height: 2800px;
			background-color: #090a0d;
			background-image: radial-gradient(
				circle,
				#2a2d34 1.15px,
				transparent 1.25px
			);
			background-size: 28px 28px;
			transform-origin: 0 0;
		}

		.piece {
			position: absolute;
			box-sizing: border-box;
		}

		#switch {
			width: 118px;
			height: 64px;
			border-radius: 999px;
			background: #2a2d34;
		}

		#switch-fill {
			position: absolute;
			inset: 0;
			border-radius: inherit;
			background: #2f6fff;
		}

		#track {
			height: 10px;
			border-radius: 999px;
			background: #2a2d34;
		}

		#fill {
			position: absolute;
			left: 0;
			top: 0;
			bottom: 0;
			border-radius: inherit;
			background: #2f6fff;
		}

		#bubble {
			position: absolute;
			min-width: 64px;
			height: 40px;
			padding: 0 12px;
			border-radius: 12px;
			background: #1b1e24;
			color: #f5f7fb;
			font-size: 20px;
			font-weight: 650;
			line-height: 40px;
			text-align: center;
			font-variant-numeric: tabular-nums;
		}

		.card {
			width: 520px;
			height: 132px;
			padding: 26px 28px;
			border: 1px solid #343841;
			border-radius: 22px;
			background: #16181d;
			color: #f5f7fb;
		}

		.card b {
			display: block;
			font-size: 28px;
			font-weight: 680;
			letter-spacing: -0.03em;
		}

		.card span {
			display: block;
			margin-top: 8px;
			color: #c5cad3;
			font-size: 22px;
		}

		.card i {
			position: absolute;
			left: 0;
			top: 28px;
			bottom: 28px;
			width: 4px;
			border-radius: 4px;
			background: #2f6fff;
		}

		#reply {
			height: 72px;
			border-radius: 999px;
			background: #1b1e24;
			color: #f5f7fb;
			font-size: 28px;
			font-weight: 650;
			line-height: 72px;
			overflow: hidden;
			white-space: nowrap;
		}

		#reply-label,
		#reply-text {
			position: absolute;
			inset: 0 28px;
		}

		#send {
			width: 72px;
			height: 72px;
			border-radius: 999px;
			background: #2a2d34;
			color: #f5f7fb;
			font-size: 28px;
			line-height: 72px;
			text-align: center;
		}

		#keys {
			position: absolute;
		}

		.key {
			position: absolute;
			height: 64px;
			border-radius: 12px;
			background: #22262e;
			color: #f5f7fb;
			font-size: 18px;
			font-weight: 650;
			line-height: 64px;
			text-align: center;
		}

		#ball {
			position: absolute;
			width: 46px;
			height: 46px;
			margin: -23px 0 0 -23px;
			border-radius: 50%;
			background: #fff;
		}

		#cursor {
			position: absolute;
			width: 28px;
			height: 28px;
			margin-top: -2px;
		}
	</style>
</head>
<body>
	<div id="stage">
		<div id="world">
			<div id="switch" class="piece">
				<div id="switch-fill"></div>
			</div>
			<div id="track" class="piece">
				<div id="fill"></div>
			</div>
			<div id="bubble" class="piece">0</div>
			<div id="card-0" class="card piece"><i></i><b>Slider</b><span>Reached 100</span></div>
			<div id="card-1" class="card piece"><i></i><b>Gravity</b><span>Something is falling</span></div>
			<div id="card-2" class="card piece"><i></i><b>Messages</b><span>What now?</span></div>
			<div id="reply" class="piece">
				<div id="reply-label">Reply</div>
				<div id="reply-text"></div>
			</div>
			<div id="send" class="piece">↑</div>
			<div id="keys"></div>
			<div id="ball"></div>
			<svg id="cursor" viewBox="0 0 24 24" aria-hidden="true">
				<path d="M5 3 L5 19 L9.2 15.2 L12.4 21 L15.2 19.7 L12 14 L18.2 14 Z" fill="#ffffff" stroke="#111318" stroke-width="1.2" stroke-linejoin="round"/>
			</svg>
		</div>
	</div>
	<script>
		window.boot = 'start'
		const TEXT = 'WANT A WEBSITE'
		const ACCENT = '#2f6fff'
		const TRACK = { x0: 1048, x1: 1768, y: 470 }
		const SWITCH = { x: 430, y: 438, w: 118, h: 64 }
		const BALL_HOME = {
			x: SWITCH.x + 34,
			y: SWITCH.y + SWITCH.h / 2,
		}
		const ROWS = ['QWERTYUIOP', 'ASDFGHJKL', 'ZXCVBNM']
		const KEY_ORIGIN = { x: 1040, y: 1768 }
		const KEY_STEP = 74

		const world = document.getElementById('world')
		const ball = document.getElementById('ball')
		const cursor = document.getElementById('cursor')
		const keysRoot = document.getElementById('keys')
		const keyNodes = new Map()

		function clamp (value, min, max) {
			return Math.max(min, Math.min(max, value))
		}

		function lerp (from, to, amount) {
			return from + (to - from) * amount
		}

		function smoother (amount) {
			const t = clamp(amount, 0, 1)
			return t * t * t * (t * (t * 6 - 15) + 10)
		}

		function spring (elapsed, omega, zeta) {
			if (elapsed <= 0) return 0
			const decay = zeta * omega
			const freq = omega * Math.sqrt(Math.max(0.0001, 1 - zeta * zeta))
			const envelope = Math.exp(-decay * elapsed)
			return 1 - envelope * (
				Math.cos(freq * elapsed) +
				(decay / freq) * Math.sin(freq * elapsed)
			)
		}

		function place (node, x, y, extra) {
			node.style.transform = extra || 'none'
			node.style.left = x + 'px'
			node.style.top = y + 'px'
		}

		function keyCenter (char) {
			if (char === ' ') {
				return {
					x: KEY_ORIGIN.x + 110 + 140,
					y: KEY_ORIGIN.y + KEY_STEP * 3 + 32,
				}
			}
			if (char === 'ENTER') {
				return {
					x: KEY_ORIGIN.x + 8 * KEY_STEP + 28 + 54,
					y: KEY_ORIGIN.y + KEY_STEP * 2 + 32,
				}
			}
			const letter = char.toUpperCase()
			for (let row = 0; row < ROWS.length; row += 1) {
				const index = ROWS[row].indexOf(letter)
				if (index >= 0) {
					return {
						x: KEY_ORIGIN.x + [0, 28, 64][row]
							+ index * KEY_STEP + 33,
						y: KEY_ORIGIN.y + row * KEY_STEP + 32,
					}
				}
			}
			return { x: KEY_ORIGIN.x, y: KEY_ORIGIN.y }
		}

		function buildKeys () {
			const spec = []
			ROWS.forEach((row, rowIndex) => {
				for (let index = 0; index < row.length; index += 1) {
					spec.push({
						id: row[index],
						label: row[index],
						x: [0, 28, 64][rowIndex] + index * KEY_STEP,
						y: rowIndex * KEY_STEP,
						w: 66,
					})
				}
			})
			spec.push({
				id: ' ',
				label: '',
				x: 110,
				y: KEY_STEP * 3,
				w: 280,
			})
			spec.push({
				id: 'ENTER',
				label: '↵',
				x: 8 * KEY_STEP + 28,
				y: KEY_STEP * 2,
				w: 108,
			})
			spec.forEach((key) => {
				const node = document.createElement('div')
				node.className = 'key'
				node.textContent = key.label
				node.style.width = key.w + 'px'
				node.style.left = key.x + 'px'
				node.style.top = key.y + 'px'
				keysRoot.appendChild(node)
				keyNodes.set(key.id, node)
			})
			place(keysRoot, KEY_ORIGIN.x, KEY_ORIGIN.y)
		}

		function arc (elapsed, duration, from, to, lift) {
			const settled = spring(elapsed, 7.2, 0.82)
			const along = smoother(elapsed / duration)
			return {
				x: lerp(from.x, to.x, settled),
				y: lerp(from.y, to.y, settled)
					- Math.sin(Math.PI * along) * lift,
			}
		}

		function hop (elapsed, from, to) {
			const amount = clamp(spring(elapsed, 22, 0.74), 0, 1.06)
			return {
				x: lerp(from.x, to.x, amount),
				y: lerp(from.y, to.y, amount),
			}
		}

		function ballAt (time) {
			const home = BALL_HOME
			const sliderStart = { x: TRACK.x0 + 8, y: TRACK.y }
			const sliderEnd = { x: TRACK.x1 - 8, y: TRACK.y }
			const cards = [860, 1060, 1260].map((y) => ({ x: 1290, y }))
			const field = { x: 1280, y: 1568 }
			const strikes = TEXT.split('').concat('ENTER')
			const typeStart = 5.4
			const typeStep = 0.19

			if (time < 0.42) return home
			if (time < 1.05) {
				return arc(time - 0.42, 0.63, home, {
					x: 690,
					y: 360,
				}, 30)
			}
			if (time < 1.45) {
				return arc(time - 1.05, 0.4, { x: 690, y: 360 }, sliderStart, 70)
			}
			if (time < 3.12) {
				const amount = smoother((time - 1.45) / 1.67)
				return {
					x: lerp(sliderStart.x, sliderEnd.x, amount),
					y: TRACK.y,
				}
			}
			if (time < 3.62) {
				return arc(time - 3.12, 0.5, sliderEnd, cards[0], 90)
			}
			if (time < 4.08) {
				return arc(time - 3.62, 0.46, cards[0], cards[1], 36)
			}
			if (time < 4.58) {
				return arc(time - 4.08, 0.5, cards[1], cards[2], 36)
			}
			if (time < 5.28) {
				return arc(time - 4.58, 0.7, cards[2], field, 50)
			}
			const typed = Math.min(
				strikes.length - 1,
				Math.max(0, Math.floor((time - typeStart) / typeStep)),
			)
			if (time < typeStart) return field
			if (time < typeStart + strikes.length * typeStep) {
				const previous = typed === 0
					? field
					: keyCenter(strikes[typed - 1])
				const next = keyCenter(strikes[typed])
				return hop(
					time - (typeStart + typed * typeStep),
					previous,
					next,
				)
			}
			if (time < 8.85) return keyCenter('ENTER')
			if (time < 9.72) {
				return arc(time - 8.85, 0.87, keyCenter('ENTER'), home, 260)
			}
			return home
		}

		function squash (time) {
			const hits = [0.42, 1.45, 3.12, 3.62, 4.08, 4.58, 5.28, 8.01]
			const typeStart = 5.4
			for (let index = 0; index < TEXT.length; index += 1) {
				hits.push(typeStart + index * 0.19)
			}
			let amount = 0
			hits.forEach((hit) => {
				const delta = time - hit
				if (delta < 0 || delta > 0.14) return
				const pulse = Math.exp(-(((delta - 0.02) / 0.04) ** 2))
				amount = Math.max(amount, pulse)
			})
			return amount
		}

		function typedCount (time) {
			if (time < 5.4) return 0
			return clamp(
				Math.floor((time - 5.4) / 0.19) + 1,
				0,
				TEXT.length,
			)
		}

		function camera (time) {
			const shots = [
				{ t: 0, x: 520, y: 490, z: Math.log(2.15) },
				{ t: 0.7, x: 560, y: 460, z: Math.log(2.05) },
				{ t: 1.4, x: 1280, y: 430, z: Math.log(1.55) },
				{ t: 3.05, x: 1460, y: 400, z: Math.log(1.5) },
				{ t: 3.5, x: 1320, y: 980, z: Math.log(1.22) },
				{ t: 4.45, x: 1320, y: 1120, z: Math.log(1.18) },
				{ t: 5.35, x: 1380, y: 1680, z: Math.log(1.18) },
				{ t: 8.2, x: 1400, y: 1720, z: Math.log(1.16) },
				{ t: 8.9, x: 1200, y: 1180, z: Math.log(0.46) },
				{ t: 9.55, x: 520, y: 490, z: Math.log(2.15) },
				{ t: 10, x: 520, y: 490, z: Math.log(2.15) },
			]
			let index = 0
			while (
				index < shots.length - 2 &&
				time > shots[index + 1].t
			) {
				index += 1
			}
			const from = shots[index]
			const to = shots[index + 1]
			const amount = smoother((time - from.t) / (to.t - from.t))
			return {
				x: lerp(from.x, to.x, amount),
				y: lerp(from.y, to.y, amount),
				zoom: Math.exp(lerp(from.z, to.z, amount)),
			}
		}

		function seek (time) {
			const t = clamp(time, 0, 10)
			const point = ballAt(t)
			const hit = squash(t)
			const cam = camera(t)
			const knobX = clamp(point.x, TRACK.x0, TRACK.x1)
			const dragging = t >= 1.4 && t < 3.2
			const latched = t >= 3.2 && t < 9.35
			const sliderX = dragging
				? knobX
				: latched
					? TRACK.x1 - 8
					: TRACK.x0 + 8
			const value = Math.round(
				((sliderX - TRACK.x0) / (TRACK.x1 - TRACK.x0)) * 100,
			)
			const switchOn = spring(t - 0.5, 16, 0.8)
				* (1 - spring(t - 9.35, 14, 0.9))
			const cardsIn = [3.2, 3.68, 4.16]
			const replyOpen = spring(t - 5.05, 9, 0.82)
			const replySent = spring(t - 8.25, 10, 0.84)
				* (1 - spring(t - 9.2, 12, 1))
			const keysIn = spring(t - 5.25, 8, 0.86)
				* (1 - spring(t - 8.95, 8, 1))
			const typeStart = 5.4
			const typeStep = 0.19
			let landedIndex = -1
			if (t >= typeStart) {
				const raw = (t - typeStart) / typeStep
				const index = Math.floor(raw)
				const into = (raw - index) * typeStep
				const arrived = spring(into, 22, 0.74) > 0.8
				landedIndex = arrived ? index : index - 1
			}
			const count = t >= 8.2
				? TEXT.length
				: clamp(landedIndex + 1, 0, TEXT.length)
			const activeKey = landedIndex < 0
				? ''
				: landedIndex >= TEXT.length
					? 'ENTER'
					: TEXT[landedIndex]

			world.style.transform = [
				'translate(960px, 540px)',
				'scale(' + cam.zoom + ')',
				'translate(' + (-cam.x) + 'px, ' + (-cam.y) + 'px)',
			].join(' ')

			place(
				document.getElementById('switch'),
				SWITCH.x,
				SWITCH.y,
			)
			document.getElementById('switch-fill').style.opacity = switchOn
			place(document.getElementById('track'), TRACK.x0, TRACK.y - 5)
			document.getElementById('track').style.width =
				(TRACK.x1 - TRACK.x0) + 'px'
			document.getElementById('fill').style.width =
				(sliderX - TRACK.x0) + 'px'
			const bubble = document.getElementById('bubble')
			bubble.textContent = String(value)
			place(bubble, sliderX - 32, TRACK.y - 78)
			bubble.style.opacity = dragging || latched ? 1 : 0

			cardsIn.forEach((start, index) => {
				const card = document.getElementById('card-' + index)
				const shown = spring(t - start, 10, 0.78)
					* (1 - spring(t - 9.15, 10, 1))
				place(card, 1040 + (1 - shown) * 70, 800 + index * 200)
				card.style.opacity = shown
			})

			const replyWidth = lerp(148, 680, replyOpen)
				* (1 - replySent) + 280 * replySent
			const reply = document.getElementById('reply')
			place(reply, 1040, 1532)
			reply.style.width = replyWidth + 'px'
			reply.style.background = replySent > 0.5 ? ACCENT : '#1b1e24'
			document.getElementById('reply-label').style.opacity =
				replyOpen < 0.45 && replySent < 0.2 ? 1 : 0
			const typed = document.getElementById('reply-text')
			typed.textContent = TEXT.slice(0, count)
			typed.style.opacity = replyOpen > 0.45 || replySent > 0.2 ? 1 : 0

			const send = document.getElementById('send')
			place(send, 1760, 1532)
			send.style.background = t >= 8.05 && t < 9.2
				? ACCENT
				: '#2a2d34'
			send.style.opacity = Math.max(keysIn, replySent)

			keysRoot.style.opacity = keysIn
			keysRoot.style.transform =
				'translateY(' + ((1 - keysIn) * 80) + 'px)'
			keyNodes.forEach((node, id) => {
				const pressed = id === activeKey && t >= 5.4 && t < 8.22
				node.style.transform = pressed
					? 'translateY(7px)'
					: 'none'
				node.style.background = pressed ? ACCENT : '#22262e'
			})

			place(
				ball,
				point.x,
				point.y,
				'scale(' + (1 + hit * 0.2) + ', ' + (1 - hit * 0.16) + ')',
			)

			const cursorFrom = { x: 470, y: 560 }
			const cursorTo = { x: 560, y: 478 }
			let cursorPoint = cursorFrom
			let pressed = 0
			if (t >= 0.16 && t < 0.62) {
				cursorPoint = {
					x: lerp(cursorFrom.x, cursorTo.x, smoother((t - 0.16) / 0.34)),
					y: lerp(cursorFrom.y, cursorTo.y, smoother((t - 0.16) / 0.34)),
				}
			} else if (t >= 0.62 && t < 9.2) {
				cursorPoint = cursorTo
				pressed = t < 0.78 ? 1 : 0
			} else if (t >= 9.2) {
				const back = smoother((t - 9.2) / 0.5)
				cursorPoint = {
					x: lerp(cursorTo.x, cursorFrom.x, back),
					y: lerp(cursorTo.y, cursorFrom.y, back),
				}
			}
			place(
				cursor,
				cursorPoint.x,
				cursorPoint.y + pressed * 5,
				'scale(' + (1 - pressed * 0.06) + ')',
			)
		}

		buildKeys()
		window.seek = seek
		const initial = Number(new URLSearchParams(location.search).get('t'))
		try {
			seek(Number.isFinite(initial) ? initial : 0)
		} catch (error) {
			window.filmError = String(error && error.stack || error)
		}
	</script>
</body>
</html>
